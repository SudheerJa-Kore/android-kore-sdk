apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId 'kore.botsdk'
                artifactId 'korebotsdklib'
                version project.findProperty('version') ?: project.findProperty('VERSION_NAME') ?: '1.0.0'
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }
}

android {
    compileSdk 36

    publishing {
        singleVariant('release')
    }

    dataBinding{
        enabled = true
    }

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    dependencies {
        api 'androidx.appcompat:appcompat:1.7.0'
        api 'de.greenrobot:eventbus:2.4.0'

        api 'com.squareup.retrofit2:retrofit:2.9.0'
        api 'com.squareup.okhttp3:logging-interceptor:4.12.0'
        api 'com.google.code.gson:gson:2.10.1'
        api group: 'com.squareup.okhttp3', name: 'okhttp', version: '4.12.0'
        api 'com.squareup.retrofit2:converter-gson:2.9.0'
        api 'io.reactivex.rxjava2:rxandroid:2.1.1'
        api 'com.jakewharton.retrofit:retrofit2-rxjava2-adapter:1.0.0'
        api group: 'org.apache.commons', name: 'commons-lang3', version: '3.3.2'
    }
    namespace 'kore.korebotsdklib'
}
